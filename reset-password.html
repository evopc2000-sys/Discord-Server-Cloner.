<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Lagoudass</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="modal-overlay active" style="background: var(--bg-dark);">
        <div class="modal-window">
            <h3>Αλλαγή Κωδικού Πρόσβασης</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">Εισάγετε τον νέο σας κωδικό πρόσβασης παρακάτω.</p>
            
            <div class="input-group">
                <label for="newPass">Νέος Κωδικός</label>
                <input type="password" id="newPass" required>
            </div>
            
            <div class="input-group">
                <label for="confirmPass">Επιβεβαίωση Νέου Κωδικού</label>
                <input type="password" id="confirmPass" required>
            </div>
            
            <button class="btn btn-primary btn-full" id="submitResetBtn">Submit</button>
            <p id="resetStatus" style="margin-top: 15px; text-align: center; font-weight: 600;"></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('submitResetBtn').onclick = async () => {
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const statusText = document.getElementById('resetStatus');

            if(!newPass || !confirmPass) {
                statusText.style.color = "var(--accent-red)";
                statusText.textContent = "Συμπληρώστε όλα τα πεδία!";
                return;
            }

            if(newPass !== confirmPass) {
                statusText.style.color = "var(--accent-red)";
                statusText.textContent = "Οι κωδικοί δεν ταιριάζουν!";
                return;
            }

            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token: token, new_password: newPass })
            });

            const data = await res.json();
            if(res.ok) {
                statusText.style.color = "var(--accent-green)";
                statusText.textContent = data.message + " Ανακατεύθυνση στο Login...";
                setTimeout(() => { window.location.href = "/"; }, 2500);
            } else {
                statusText.style.color = "var(--accent-red)";
                statusText.textContent = data.detail;
            }
        };
    </script>
</body>
</html>
